name: API Go CD pipeline

on:
  workflow_run:
    workflows: ["API Go CI pipeline"]
    types:
      - completed
    branches: ["main"]

concurrency:
  group: api-go-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    name: Package and publish to GHCR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # git writeback
      - name: Checkout DevOps Infra Repo
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/devops-infra'
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: devops-infra

      - name: Update Image Tag in Manifest
        run: |
          TARGET_TAG="sha-${{ github.event.workflow_run.head_sha }}"
          
          cd devops-infra/kubernetes/platform/api-golang
          
          sed -i "s|image: ghcr.io/ishehov-devops-practice/api-golang:.*|image: ghcr.io/ishehov-devops-practice/api-golang:${TARGET_TAG}|g" deployment.yml

      - name: Commit and Push Changes to Infra Repo
        run: |
          cd devops-infra
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add kubernetes/platform/api-golang/deployment.yml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): automated api-golang rollout to sha-${{ github.event.workflow_run.head_sha }}"
            git push origin main
          else
            echo "No changes detected. Manifest is already up to date."
          fi